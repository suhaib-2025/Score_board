<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="column">
            <h3 class="title">HOME</h3>
            <div class="score-card">
                <span id="home-score" class="score-display">0</span>
            </div>
            <div class="btn-group">
                <button onclick="addScore('home', 1)">+1</button>
                <button onclick="addScore('home', 2)">+2</button>
                <button onclick="addScore('home', 3)">+3</button>
            </div>
        </div>

        <div class="column">
            <h3 class="title">GUEST</h3>
            <div class="score-card">
                <span id="guest-score" class="score-display">0</span>
            </div>
            <div class="btn-group">
                <button onclick="addScore('guest', 1)">+1</button>
                <button onclick="addScore('guest', 2)">+2</button>
                <button onclick="addScore('guest', 3)">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
